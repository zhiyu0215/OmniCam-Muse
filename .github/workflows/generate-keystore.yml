name: 生成签名证书（一次性）

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: 生成证书并转成文本
        run: |
          keytool -genkeypair -v -keystore port.keystore -alias muse -keyalg RSA -keysize 2048 -validity 10000 -storepass muse123456 -keypass muse123456 -dname "CN=OmniCamMuse"
          base64 -w0 port.keystore > port-keystore-base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            port.keystore
            port-keystore-base64.txt
